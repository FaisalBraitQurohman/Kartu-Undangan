services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: undangkita
      POSTGRES_USER: undangkita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - undangkita_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangkita -d undangkita"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  undangkita_pg:
